plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

// Stonecutter runs this file once per Minecraft version (versions/26.3, versions/26.1.2), each time as that version's
// own Gradle project, with its versions/<v>/gradle.properties added to the root one. So inside here, file('x') means
// versions/<v>/x; anything shared (generated resources, templates) uses rootProject.file('x') instead.
// The Java sources in src/ are shared: Stonecutter points every version at them, adjusted by the //? comments.
// (The wrapper task moved to stonecutter.gradle: it belongs to the root project.)

version = mod_version
group = mod_group_id

// Renames between versions, applied to the sources when switching the active version and when building the others.
// Written as replace '<older name>', '<newer name>': the first argument to string() is "is this version at least the
// newer one", so 26.3 sources use the newer names and 26.1.2's get the older ones. Only add exact, unique text here
// (full class names, "Class.method("): a short name would also change text that merely contains it.
stonecutter {
    // 26.2 moved setScreen (and the current screen) from Minecraft to Minecraft.gui
    replacements.string(current.parsed.matches('>=26.2')) {
        replace 'Minecraft.getInstance().setScreen(', 'Minecraft.getInstance().gui.setScreen('
    }
    // 26.2 fixed vanilla's spelling of "Instantaneous" (InstantenousMobEffect, applyInstantenousEffect, isInstantenous)
    replacements.string(current.parsed.matches('>=26.2')) {
        replace 'Instantenous', 'Instantaneous'
    }
    // 26.2 moved the in-game HUD (and its effect icon lookup) from Gui into the new Hud class.
    // Write this call in full (net.minecraft.client.gui.Hud.getMobEffectSprite) so only it is renamed.
    replacements.string(current.parsed.matches('>=26.2')) {
        replace 'net.minecraft.client.gui.Gui.getMobEffectSprite(', 'net.minecraft.client.gui.Hud.getMobEffectSprite('
    }
    // 26.3 renamed PoseStack#mulPose to rotate (only written as poseStack.rotate( so other rotate( calls stay)
    replacements.string(current.parsed.matches('>=26.3')) {
        replace 'poseStack.mulPose(', 'poseStack.rotate('
    }
    // 26.3 renamed PushReaction.DESTROY (broken and dropped when a piston pushes it) to POPPED
    replacements.string(current.parsed.matches('>=26.3')) {
        replace 'PushReaction.DESTROY', 'PushReaction.POPPED'
    }

    // Files left out of older versions. Datagen only ever runs from 26.3 (its output in src/generated is shared), and
    // its recipe/registry datagen API is 26.3-only, so 26.1.2 doesn't compile it. Paths are relative to src/main/java.
    // Every datagen file goes except DustTags.java, which isn't datagen: the mod's tag keys, used all over the mod.
    files {
        def dataGen = 'com/mowmaster/dust/DustDataGen/'
        ['DustDataGenerator', 'DustEquipmentAssets', 'DustProviderBasicRecipe', 'DustProviderBlockLootTable',
         'DustProviderGlobalLootModifier', 'DustProviderModel', 'DustProviderSpellConversions',
         'DustTagProviderBlock', 'DustTagProviderItem', 'DustWorldgen'].each { name ->
            disable(current.parsed.matches('<26.3'), dataGen + name + '.java')
        }
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators. Shared by all versions (in the root src/, not versions/<v>/);
    // run datagen from the 26.3 project.
    srcDir(rootProject.file('src/generated/resources'))

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // MowLib, published from the MowLib project with `gradlew publishToMavenLocal`.
    // content { includeGroup ... } only looks for MowLib here, so nothing else is accidentally taken from the
    // local repository.
    mavenLocal {
        content {
            includeGroup 'com.mowmaster.mowlib'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1 and later, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Datagen runs from 26.3 only: its providers are 26.3-only (left out of 26.1.2, see the stonecutter block), and its
        // output in src/generated is shared by both versions. So 26.1.2 gets no data run (and no runData task).
        if (stonecutter.current.parsed.matches('>=26.3')) data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', rootProject.file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    // MowLib is published once per Minecraft version (mowlib-26.3, mowlib-26.1.2): ask for the one matching this mod's
    // minecraft_version (gradle.properties). Double quotes so Groovy fills in ${minecraft_version}.
    jarJar(implementation(group: 'com.mowmaster.mowlib', name: "mowlib-${minecraft_version}")) {
        version {
            strictly '[0.0.5,1.0.0)'
            prefer '0.0.5'
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file("src/main/templates")
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // Publish as com.mowmaster.dust:dust-<minecraft version>:<mod version> (e.g. dust-26.3:0.0.1), so each
            // Minecraft version's jar has its own name. Without setting this, Maven uses the Gradle project name, which
            // is the version folder's ("26.3").
            artifactId = "${mod_id}-${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // javac stops after 100 errors by default; show them all, so one 26.1.2 build lists everything to fix
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

// ---- 26.1.2 data ----
// Datagen only runs from 26.3, and 26.3 changed some data formats, so the 26.1.2 build adjusts the shared data:
//  - adds src/main/resources-26.1.2: data only 26.1.2 reads (configured features, NeoForge's compostables data map)
//  - leaves out the brewing recipes: 26.1.2 has no data-driven brewing (DustBrewingLegacy adds them in code)
//  - rewrites the generated loot tables, loot modifiers' conditions and recipe advancements into the 26.1.2 format as
//    they're copied
//    (LegacyData, at the end of this file), so they follow whatever datagen makes without keeping a second copy
// stonecutter.current is the version this build.gradle is running for (it runs once per version).
if (stonecutter.current.parsed.matches('<26.3')) {
    sourceSets.main.resources.srcDir(rootProject.file('src/main/resources-26.1.2'))
    tasks.named('processResources', ProcessResources) {
        exclude('data/*/recipe/brewing/**')
        // filesMatching runs its block for each copied file matching the pattern; filter(SomeReader) passes the
        // file's text through that FilterReader class on the way
        filesMatching('data/*/loot_table/**/*.json') { filter(LegacyLootFilter) }
        filesMatching('data/*/advancement/**/*.json') { filter(LegacyAdvancementFilter) }
        filesMatching('data/*/loot_modifiers/**/*.json') { filter(LegacyLootModifierFilter) }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---- 26.3 -> 26.1.2 data conversion (used above) ----
// Groovy classes can be declared right in a build script. Only the formats Dust's datagen makes are handled; anything
// else stops the 26.1.2 build with a message saying what to add, rather than shipping data 26.1.2 can't read.
// 26.3 changed, in loot tables: "conditions": [...] -> "condition" (one, or a list), "functions" -> "modifier",
// the "condition"/"function" key inside each -> "type", named conditions ("minecraft:tool/can_silk_touch") instead of
// written-out ones, and "bonus_rolls" became optional. In advancements: recipe_unlocked's "recipe" -> "recipes".
class LegacyData
{
    // 26.3's named silk touch condition, written out the 26.1.2 way (as vanilla 26.1.2's own loot tables have it)
    static final Map SILK_TOUCH = [condition: 'minecraft:match_tool',
                                   predicate: [predicates: ['minecraft:enchantments': [[enchantments: 'minecraft:silk_touch', levels: [min: 1]]]]]]

    static List listOf(value)
    {
        value instanceof List ? value : [value]
    }

    static Map condition(value)
    {
        if (value instanceof String) {
            if (value == 'minecraft:tool/can_silk_touch') return SILK_TOUCH
            throw new org.gradle.api.GradleException("26.1.2 data: no 26.1.2 version of the loot condition '${value}'. Add one to LegacyData in build.gradle.")
        }
        // 26.3's match_block (one block, maybe with a state) was 26.1.2's block_state_property
        if (value.type == 'minecraft:match_block') {
            if (!(value.blocks instanceof String) || value.blocks.startsWith('#')) {
                throw new org.gradle.api.GradleException("26.1.2 data: match_block for ${value.blocks} has no 26.1.2 version (only a single block). Add one to LegacyData in build.gradle.")
            }
            Map block = [condition: 'minecraft:block_state_property', block: value.blocks]
            if (value.state != null) block.properties = value.state
            return block
        }
        Map out = [:]
        value.each { key, inner ->
            if (key == 'type') out.condition = inner
            else if (key == 'terms') out.terms = listOf(inner).collect { condition(it) }   // any_of / all_of
            else if (key == 'term') out.term = condition(inner)                            // inverted
            else out[key] = inner
        }
        out
    }

    // A loot modifier: only its condition changes (its own "type" is the modifier's, and stays)
    static Map lootModifier(Map modifier)
    {
        if (modifier.condition != null) modifier.condition = condition(modifier.condition)
        modifier
    }

    static Map function(Map value)
    {
        Map out = [:]
        value.each { key, inner ->
            if (key == 'type') out.function = inner
            else if (key == 'condition') out.conditions = listOf(inner).collect { condition(it) }
            else out[key] = inner
        }
        out
    }

    // A table, pool or entry (they share these keys). Entries keep "type": only conditions and functions renamed it.
    static Map loot(Map node, boolean pool)
    {
        Map out = [:]
        node.each { key, inner ->
            switch (key) {
                case 'condition': out.conditions = listOf(inner).collect { condition(it) }; break
                case 'modifier': out.functions = listOf(inner).collect { function(it as Map) }; break
                case 'pools': out.pools = inner.collect { loot(it as Map, true) }; break
                case 'entries':
                case 'children': out[key] = inner.collect { loot(it as Map, false) }; break
                default: out[key] = inner
            }
        }
        if (pool && !out.containsKey('bonus_rolls')) out.bonus_rolls = 0.0
        out
    }

    static Map advancement(Map advancement)
    {
        advancement.criteria?.each { name, criterion ->
            if (criterion.trigger == 'minecraft:recipe_unlocked' && criterion.conditions?.containsKey('recipes')) {
                def recipes = criterion.conditions.remove('recipes')
                if (recipes instanceof List) {
                    if (recipes.size() != 1) throw new org.gradle.api.GradleException("26.1.2 data: recipe_unlocked can only check one recipe on 26.1.2 (criterion '${name}')")
                    recipes = recipes[0]
                }
                criterion.conditions.recipe = recipes
            }
        }
        advancement
    }

    static String convert(Reader input, Closure<Map> change)
    {
        Map json = new groovy.json.JsonSlurper().parse(input) as Map
        groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(change(json)))
    }
}

// FilterReaders for filesMatching { filter(...) }: Gradle makes one per file, handing it the file's text.
// This one reads it all, converts it, and gives back the converted text.
class LegacyLootFilter extends FilterReader
{
    LegacyLootFilter(Reader input)
    {
        super(new StringReader(LegacyData.convert(input) { LegacyData.loot(it, false) }))
    }
}

class LegacyAdvancementFilter extends FilterReader
{
    LegacyAdvancementFilter(Reader input)
    {
        super(new StringReader(LegacyData.convert(input) { LegacyData.advancement(it) }))
    }
}

class LegacyLootModifierFilter extends FilterReader
{
    LegacyLootModifierFilter(Reader input)
    {
        super(new StringReader(LegacyData.convert(input) { LegacyData.lootModifier(it) }))
    }
}
